<p-toast position="top-right" [life]="4500" />
<p-toast key="offline" position="bottom-center" />

<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Mobile Toggle Button (visible only on mobile) -->
  <button class="sidebar-toggle" (click)="toggleSidebar()">
    <i class="pi" [class.pi-bars]="!sidebarCollapsed() && !mobileMenuOpen()" [class.pi-times]="sidebarCollapsed() || mobileMenuOpen()"></i>
  </button>

  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="mobileMenuOpen()" [class.collapsed]="sidebarCollapsed()">
    <div class="sidebar-header">
      @if (isMobile()) {
        <button class="mobile-close-btn" (click)="closeMenus()">
          <i class="pi pi-times"></i>
        </button>
      }
      @if (!sidebarCollapsed()) {
        <div class="logo-wrapper">
          <img src="assets/images/LOGO.png" alt="Bookwise" class="sidebar-logo" />
        </div>
      } @else {
        <img src="assets/images/icono.svg" alt="BW" class="sidebar-logo-icon" />
      }
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.routerLink) {
        <a [routerLink]="item.routerLink"
           class="nav-item"
           [class.active]="isActive(item.routerLink!)"
           [title]="sidebarCollapsed() ? item.label : ''">
          <i class="pi" [ngClass]="item.icon"></i>
          @if (!sidebarCollapsed()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (!sidebarCollapsed()) {
        <div class="theme-selector">
          <p-select
            [options]="themeOptions"
            [(ngModel)]="currentTheme"
            optionLabel="label"
            optionValue="value"
            placeholder="Tema"
            (onChange)="onThemeChange($event.value)"
            [appendTo]="'body'"
            class="theme-select"
          />
        </div>
      }

      <button class="nav-item dark-mode-btn" (click)="toggleDarkMode()" [title]="sidebarCollapsed() ? (darkMode() ? 'Modo Claro' : 'Modo Oscuro') : ''">
        <i class="pi" [class.pi-moon]="!darkMode()" [class.pi-sun]="darkMode()"></i>
        @if (!sidebarCollapsed()) {
          <span class="nav-label">{{ darkMode() ? 'Modo Claro' : 'Modo Oscuro' }}</span>
        }
      </button>

      <button class="nav-item logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        @if (!sidebarCollapsed()) {
          <span class="nav-label">Salir</span>
        }
      </button>
    </div>
  </aside>

  @if (mobileMenuOpen()) {
    <div class="mobile-overlay" (click)="closeMenus()"></div>
  }

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
