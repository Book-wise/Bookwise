<p-toast key="global" position="top-right" [life]="4500" />

<bw-subscription-inactive-dialog />

<!-- Dos filas: la cabecera ocupa todo el ancho (y no se mueve al abrir el
     panel) y debajo va el cuerpo `panel + contenido`. -->
<div class="layout" [class.panel-open]="panelOpen()">
  <bw-app-header [mobileMenuOpen]="panelOpen()" [onToggleMenu]="() => toggleSidebar()" />

  <div class="layout__body">
    <!-- Panel de navegación: nav original + mes (tarjeta fija) + cerrar sesión,
         sobre el gradiente de marca. Deshabilitado (inert) cuando está cerrado
         para que sus controles no se puedan tabular. -->
    <aside
      class="sidebar"
      [class.mobile-open]="mobileMenuOpen()"
      [inert]="!panelOpen()"
    >
      <nav class="sidebar-nav">
        @for (item of menuItems(); track item.routerLink) {
          <a
            [routerLink]="item.routerLink"
            class="nav-item"
            [class.active]="isActive(item.routerLink!)"
          >
            <i class="pi" [ngClass]="item.icon"></i>
            <span class="nav-label">{{ langService.t(item.label!) }}</span>
          </a>
        }
      </nav>

      <!-- Mes: tarjeta clara fija sobre el gradiente, sin cabecera plegable. -->
      <div class="sidebar-widget">
        <bw-agenda-navigator />
      </div>

      <div class="sidebar-footer">
        <button type="button" class="sidebar-logout" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          <span>{{ langService.t('ui.logout') }}</span>
        </button>
      </div>
    </aside>

    @if (mobileMenuOpen()) {
      <div class="mobile-overlay" (click)="closeMenus()"></div>
    }

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
