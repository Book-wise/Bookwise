<p-toast key="global" position="top-right" [life]="4500" />

<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Mobile Toggle Button (visible only on mobile) -->
  <button class="sidebar-toggle" (click)="toggleSidebar()">
    <i class="pi" [class.pi-bars]="!mobileMenuOpen()" [class.pi-times]="mobileMenuOpen()"></i>
  </button>

  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="mobileMenuOpen()" [class.collapsed]="effectivelyCollapsed()">
    <div class="sidebar-header">
      @if (isMobile()) {
        <button class="mobile-close-btn" (click)="closeMenus()">
          <i class="pi pi-times"></i>
        </button>
      }
      <div class="logo-wrapper" [class.logo-hidden]="effectivelyCollapsed()">
        <img src="assets/images/LOGO.png" alt="Bookwise" class="sidebar-logo" />
      </div>
      <div class="logo-icon-wrapper" [class.logo-hidden]="!effectivelyCollapsed()">
        <img src="assets/images/icono.svg" alt="BW" class="sidebar-icon-img" />
      </div>
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.routerLink) {
        <a [routerLink]="item.routerLink"
           class="nav-item"
           [class.active]="isActive(item.routerLink!)"
           [title]="effectivelyCollapsed() ? langService.t(item.label!) : ''">
          <i class="pi" [ngClass]="item.icon"></i>
          @if (!effectivelyCollapsed()) {
            <span class="nav-label">{{ langService.t(item.label!) }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (!effectivelyCollapsed()) {
        <div class="theme-selector">
          <p-select
            [options]="themeOptions"
            [(ngModel)]="currentTheme"
            optionLabel="label"
            optionValue="value"
            placeholder="Tema"
            (onChange)="onThemeChange($event.value)"
            [appendTo]="'body'"
            class="theme-select"
          />
        </div>
        <div class="theme-selector">
          <p-select
            [options]="langService.langOptions"
            [ngModel]="langService.lang()"
            optionLabel="label"
            optionValue="value"
            (onChange)="onLangChange($event.value)"
            [appendTo]="'body'"
            class="theme-select"
          />
        </div>
      } @else {
        <button class="nav-item" (click)="onLangChange(langService.lang() === 'es' ? 'en' : 'es')" [title]="langService.lang() === 'es' ? 'English' : 'Español'">
          <i class="pi pi-globe"></i>
        </button>
      }

      <button class="nav-item dark-mode-btn" (click)="toggleDarkMode()" [title]="effectivelyCollapsed() ? langService.t(darkMode() ? 'ui.light_mode' : 'ui.dark_mode') : ''">
        <i class="pi" [class.pi-moon]="!darkMode()" [class.pi-sun]="darkMode()"></i>
        @if (!effectivelyCollapsed()) {
          <span class="nav-label">{{ langService.t(darkMode() ? 'ui.light_mode' : 'ui.dark_mode') }}</span>
        }
      </button>

      <button class="nav-item logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        @if (!effectivelyCollapsed()) {
          <span class="nav-label">{{ langService.t('ui.logout') }}</span>
        }
      </button>
    </div>
  </aside>

  @if (!isMobile()) {
    <button class="sidebar-collapse-tab" (click)="toggleSidebar()" [title]="sidebarCollapsed() ? langService.t('ui.expand_sidebar') : langService.t('ui.collapse_sidebar')">
      <i class="pi" [class.pi-chevron-left]="!sidebarCollapsed()" [class.pi-chevron-right]="sidebarCollapsed()"></i>
    </button>
  }

  @if (mobileMenuOpen()) {
    <div class="mobile-overlay" (click)="closeMenus()"></div>
  }

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
