<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [dismissableMask]="false"
  [style]="{ width: '420px' }">
  <ng-template pTemplate="header">
    <span>{{ lang.t('subscription.inactive.title') }}</span>
  </ng-template>

  <div class="inactive">
    <i class="pi pi-exclamation-circle inactive__icon"></i>
    <p class="inactive__detail">
      {{ isOwner() ? lang.t('subscription.inactive.detail_owner') : lang.t('subscription.inactive.detail_other') }}
    </p>
  </div>

  <ng-template pTemplate="footer">
    @if (isOwner()) {
      <p-button
        [label]="lang.t('subscription.inactive.reactivate')"
        icon="pi pi-credit-card"
        (onClick)="reactivate()" />
    } @else {
      <p-button
        [label]="lang.t('subscription.inactive.dismiss')"
        severity="secondary"
        (onClick)="dismiss()" />
    }
  </ng-template>
</p-dialog>
