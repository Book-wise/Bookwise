<header class="app-header">
  <!-- Hamburguesa: el MISMO botón abre y cierra el panel, a cualquier ancho.
       Sin fondo/borde por default, `--bw-surface-muted` en hover y `--bw-700`
       cuando el panel está abierto. -->
  <button
    type="button"
    class="app-header__menu-btn"
    [class.app-header__menu-btn--open]="panelOpen()"
    (click)="onToggleMenu()()"
    [attr.aria-label]="lang.t('ui.toggle_menu')"
    [attr.aria-expanded]="panelOpen()"
  >
    <i class="pi" [class.pi-bars]="!panelOpen()" [class.pi-times]="panelOpen()"></i>
  </button>

  <!-- Marca: SOLO el wordmark (sin el icono), el mismo del sidebar grande. -->
  <a
    class="app-header__wordmark"
    href="https://www.bookwise.cl"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img src="assets/images/logo_side_transparente.png" alt="Bookwise" />
  </a>

  <div class="app-header__left">
    @if (business(); as biz) {
      <button
        type="button"
        class="app-header__business"
        [class.app-header__business--button]="canSwitch()"
        (click)="canSwitch() ? bizPopover.toggle($event) : null"
      >
        <span class="app-header__monogram">
          <bw-user-avatar
            [name]="biz.name"
            [image]="businessLogo()"
            size="md"
            shape="square" />
        </span>
        <div class="app-header__business-info">
          <span class="app-header__business-name">{{ biz.name }}</span>
          @if (biz.rut) {
            <span class="app-header__business-rut">{{ lang.t('ui.rut') }}: {{ biz.rut }}</span>
          }
        </div>
        @if (canSwitch()) {
          <i class="pi pi-chevron-down app-header__chevron"></i>
        }
      </button>

      <p-popover #bizPopover class="biz-selector-popover" [dismissable]="true">
        <div class="biz-selector">
          <div class="biz-selector__title">{{ lang.t('settings.business') }}</div>
          @for (b of businesses(); track b.id) {
            <button
              type="button"
              class="biz-selector__item"
              [class.biz-selector__item--active]="b.id === currentBusinessId()"
              (click)="switchTo(b); bizPopover.hide()"
            >
              <span class="biz-selector__monogram">
                <bw-user-avatar
                  [name]="b.name"
                  [image]="b.logo_url"
                  size="sm"
                  shape="square" />
              </span>
              <div class="biz-selector__info">
                <span class="biz-selector__name">{{ b.name }}</span>
                <span class="biz-selector__rut">{{ lang.t('ui.rut') }}: {{ b.rut }}</span>
              </div>
            </button>
          }
        </div>
      </p-popover>
    }
  </div>

  <div class="app-header__right">
    <!-- Slot de los controles de calendario/período — «Hoy», «‹», «›» y el
         select de vista (Mes / Semana / Día) — que pertenecen a la barra del
         calendario (T4/T5). Van ACÁ, antes de las preferencias, para que el
         selector de tema quede pegado al menú de cuenta. -->
    <div class="app-header__actions">
      <p-select
        class="app-header__theme"
        [options]="appearanceOptions()"
        [ngModel]="appearance()"
        (ngModelChange)="onAppearanceChange($event)"
        optionLabel="label"
        optionValue="value"
        [ariaLabel]="lang.t('settings.appearance.mode')"
        appendTo="body"
      />
      <!-- A futuro: notificaciones / mensajes -->
    </div>
    <bw-account-menu />
  </div>
</header>
