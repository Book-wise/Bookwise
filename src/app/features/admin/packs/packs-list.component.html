<p-card header="Packs de Servicios">
  <p-table [value]="packs()" [tableStyle]="{'min-width': '50rem'}" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Servicio</th>
        <th>Sesiones</th>
        <th>Precio</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-pack>
      <tr>
        <td>{{ pack.id }}</td>
        <td>{{ pack.name }}</td>
        <td>{{ pack.service?.name || 'N/A' }}</td>
        <td>{{ pack.total_sessions }}</td>
        <td>\${{ pack.price | number:'1.2-2' }}</td>
        <td>
          <p-tag [value]="pack.active ? 'Activo' : 'Inactivo'" 
                 [severity]="pack.active ? 'success' : 'danger'"></p-tag>
        </td>
        <td>
          <p-button icon="pi pi-pencil" styleClass="p-button-text" pTooltip="Editar"></p-button>
          <p-button icon="pi pi-eye" styleClass="p-button-text" pTooltip="Ver"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">No se encontraron packs</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
