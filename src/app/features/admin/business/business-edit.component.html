<div class="biz-edit">
  <div class="biz-edit__head">
    <div>
      <h1>{{ lang.t('settings.business') }}</h1>
      <p>{{ lang.t('biz.edit.subtitle') }}</p>
    </div>
    <p-button label="{{ lang.t('biz.negocios') }}" icon="pi pi-arrow-left" severity="secondary" [text]="true" [routerLink]="'/admin/negocios'" />
  </div>

  @if (business(); as biz) {
    <bw-business-hero
      [business]="biz"
      [canManage]="canManage()"
      (logoChanged)="onLogoChanged()" />

    <p-card class="biz-edit-card">
      <div class="biz-form">
        <div class="field">
          <label>{{ lang.t('settings.business') }} *</label>
          <input pInputText [ngModel]="name()" (ngModelChange)="name.set($event)" class="w-full" />
        </div>
        <div class="field">
          <label>{{ lang.t('settings.business.email') }}</label>
          <input pInputText [ngModel]="email()" (ngModelChange)="email.set($event)" class="w-full" />
        </div>
        <div class="field">
          <label>{{ lang.t('settings.business.address') }}</label>
          <input pInputText [ngModel]="address()" (ngModelChange)="address.set($event)" class="w-full" />
        </div>
        <div class="field">
          <label>{{ lang.t('settings.business.phone') }}</label>
          <input pInputText [ngModel]="phone()" (ngModelChange)="phone.set($event)" class="w-full" />
        </div>
        <div class="field">
          <label>{{ lang.t('settings.business.plan') }}</label>
          <p-select
            [options]="PLAN_OPTIONS"
            [ngModel]="plan()"
            (ngModelChange)="plan.set($event)"
            optionLabel="label"
            optionValue="value"
            class="w-full"
          />
        </div>
      </div>

      <div class="biz-actions">
        <p-button label="{{ lang.t('ui.cancel') }}" severity="secondary" [text]="true" [routerLink]="'/admin/negocios'" />
        <p-button label="{{ lang.t('biz.save') }}" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
      </div>
    </p-card>
  } @else {
    <p class="biz-edit__empty">{{ lang.t('biz.edit.not_found') }}</p>
  }
</div>
