<p-card header="Clientes">
  <div class="mb-3">
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input
        type="text"
        type="text"
        pInputText
        placeholder="Buscar cliente..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event); onSearch()"
      />
    </p-iconfield>
  </div>

  <p-table
    [value]="clients()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [paginator]="true"
    [rows]="10"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-client>
      <tr>
        <td>{{ client.id }}</td>
        <td>{{ client.first_name }} {{ client.last_name }}</td>
        <td>{{ client.email }}</td>
        <td>{{ client.phone }}</td>
        <td>
          <p-tag
            [value]="client.active ? 'Activo' : 'Inactivo'"
            [severity]="client.active ? 'success' : 'danger'"
          ></p-tag>
        </td>
        <td>
          <p-button icon="pi pi-eye" styleClass="p-button-text" pTooltip="Ver"></p-button>
          <p-button
            icon="pi pi-shopping-cart"
            styleClass="p-button-text"
            pTooltip="Ver Packs"
          ></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center">No se encontraron clientes</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
