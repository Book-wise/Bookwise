<p-dialog
  header="Bloquear Horario"
  [(visible)]="visible"
  [modal]="true"
  [style]="{width: '540px'}"
  [contentStyle]="{'overflow-y': 'auto', 'max-height': '70vh'}"
  [draggable]="false"
  (onHide)="onClose()">

  <div class="block-form">

    <!-- Fecha y hora inicio -->
    <div class="datetime-row">
      <div class="field">
        <label>Fecha inicio</label>
        <p-datepicker
          [(ngModel)]="startDateValue"
          dateFormat="dd/mm/yy"
          [appendTo]="'body'"
          styleClass="w-full" />
      </div>
      <div class="field">
        <label>Hora inicio</label>
        <input
          type="time"
          class="time-input"
          [value]="startTimeStr()"
          (change)="onStartTimeChange($event)" />
      </div>
    </div>

    <!-- Fecha y hora fin -->
    <div class="datetime-row">
      <div class="field">
        <label>Fecha fin</label>
        <p-datepicker
          [(ngModel)]="endDateValue"
          dateFormat="dd/mm/yy"
          [appendTo]="'body'"
          styleClass="w-full" />
      </div>
      <div class="field">
        <label>Hora fin</label>
        <input
          type="time"
          class="time-input"
          [value]="endTimeStr()"
          (change)="onEndTimeChange($event)" />
      </div>
    </div>

    <!-- Motivo -->
    <div class="field">
      <label>Motivo (opcional)</label>
      <textarea
        pTextArea
        [(ngModel)]="reason"
        rows="2"
        placeholder="Motivo del bloqueo"
        class="w-full">
      </textarea>
    </div>

    <!-- Repetición -->
    <div class="repeat-section">

      <div class="repeat-toggle-row">
        <p-checkbox
          [(ngModel)]="repeatEnabledValue"
          [binary]="true"
          inputId="repeatBlock" />
        <label for="repeatBlock" class="repeat-toggle-label">Repetir bloqueo</label>
      </div>

      @if (repeatEnabled()) {
        <!-- Frecuencia -->
        <div class="repeat-freq-row">
          <div class="freq-select">
            <label class="repeat-label">Repetir</label>
            <p-select
              [options]="repeatTypeOptions"
              [(ngModel)]="repeatTypeValue"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
              styleClass="w-full" />
          </div>
          <div class="freq-interval">
            <label class="repeat-label">Cada</label>
            <div class="interval-row">
              <p-inputnumber
                [(ngModel)]="repeatIntervalValue"
                [min]="1"
                [max]="99"
                styleClass="interval-input" />
              <span class="interval-label">{{ intervalLabel() }}</span>
            </div>
          </div>
        </div>

        <!-- Días de la semana -->
        @if (repeatType() === 'weekly') {
          <div class="field">
            <label class="repeat-label">Se repite el</label>
            <div class="day-buttons">
              @for (day of days; track day.value) {
                <button
                  type="button"
                  class="day-btn"
                  [class.active]="isDaySelected(day.value)"
                  (click)="toggleDay(day.value)">
                  {{ day.label }}
                </button>
              }
            </div>
          </div>
        }

        <!-- Finaliza -->
        <div class="field">
          <label class="repeat-label">Finaliza:</label>
          <div class="end-row">
            <p-select
              [options]="endTypeOptions"
              [(ngModel)]="repeatEndTypeValue"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
              styleClass="end-select" />

            @if (repeatEndType() === 'after') {
              <p-inputnumber
                [(ngModel)]="repeatCountValue"
                [min]="1"
                [max]="999"
                placeholder="Ej. 5"
                styleClass="count-input" />
              <span class="end-label">repeticiones</span>
            }

            @if (repeatEndType() === 'until') {
              <p-datepicker
                [(ngModel)]="repeatUntilValue"
                dateFormat="dd/mm/yy"
                [appendTo]="'body'"
                styleClass="until-input" />
            }
          </div>
          @if (repeatEndType() === 'after') {
            <span class="hint">Incluye la original</span>
          }
        </div>
      }

    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="onClose()">
      </p-button>
      <p-button
        [label]="repeatEnabled() ? 'Bloquear y repetir' : 'Bloquear horario'"
        icon="pi pi-lock"
        [loading]="saving()"
        (onClick)="block()">
      </p-button>
    </div>
  </ng-template>
</p-dialog>
