<div class="reserva-form">
  <!-- ── Fecha + Hora ──────────────────────────────────────────────────────────── -->
  <div class="rf-card rf-datetime">
    <div class="rf-field">
      <label class="rf-label">Fecha</label>
      <p-datepicker
        [ngModel]="selectedDate()"
        (ngModelChange)="selectedDate.set($event)"
        dateFormat="DD d 'de' MM 'de' yy"
        [appendTo]="'body'"
        [inputStyle]="{ width: '100%' }"
        class="rf-datepicker"
      />
    </div>

    <div class="rf-field">
      <label class="rf-label">Hora</label>
      <div class="rf-time-row">
        <div class="rf-time-group">
          <span class="rf-time-label">Desde</span>
          <p-select [options]="hours"   [ngModel]="startHour()"   (ngModelChange)="startHour.set($event)"   [style]="{ width: '5.3rem' }" />
          <span class="rf-sep">:</span>
          <p-select [options]="minutes" [ngModel]="startMinute()" (ngModelChange)="startMinute.set($event)" [style]="{ width: '5.3rem' }" />
        </div>
        <div class="rf-time-group">
          <span class="rf-time-label">Hasta</span>
          <p-select [options]="hours"   [ngModel]="endHour()"     (ngModelChange)="endHour.set($event)"     [style]="{ width: '5.3rem' }" />
          <span class="rf-sep">:</span>
          <p-select [options]="minutes" [ngModel]="endMinute()"   (ngModelChange)="endMinute.set($event)"   [style]="{ width: '5.3rem' }" />
        </div>
      </div>
    </div>
  </div>

  <!-- ── Cliente ───────────────────────────────────────────────────────────────── -->
  @if (!editingClient()) {
    <bw-patient-card
      [client]="booking().client!"
      [showNotifications]="true"
      [showEdit]="true"
      (editRequested)="onEditRequested()"
    />
  } @else {
    <div class="rf-card rf-client-edit">
      <p class="rce-title">Editando información</p>

      <!-- Required section -->
      <div class="rce-section">
        <button type="button" class="rce-section__header" (click)="reqOpen.set(!reqOpen())">
          <span>Información requerida</span>
          <i class="pi" [class.pi-chevron-up]="reqOpen()" [class.pi-chevron-down]="!reqOpen()"></i>
        </button>
        @if (reqOpen()) {
          <div class="rce-section__content">
            <div class="rce-field">
              <label class="rf-label">Nombre <span class="rce-req">*</span></label>
              <input
                pInputText
                [ngModel]="editFirstName()"
                (ngModelChange)="editFirstName.set($event)"
                class="rce-input"
              />
            </div>
            <div class="rce-field">
              <label class="rf-label">Apellido <span class="rce-req">*</span></label>
              <input
                pInputText
                [ngModel]="editLastName()"
                (ngModelChange)="editLastName.set($event)"
                class="rce-input"
              />
            </div>
          </div>
        }
      </div>

      <!-- Additional section -->
      <div class="rce-section">
        <button type="button" class="rce-section__header" (click)="addOpen.set(!addOpen())">
          <span>Información adicional</span>
          <i class="pi" [class.pi-chevron-up]="addOpen()" [class.pi-chevron-down]="!addOpen()"></i>
        </button>
        @if (addOpen()) {
          <div class="rce-section__content">
            <div class="rce-field">
              <label class="rf-label">Email</label>
              <input
                pInputText
                type="email"
                [ngModel]="editEmail()"
                (ngModelChange)="editEmail.set($event)"
                class="rce-input"
              />
            </div>
            <div class="rce-field">
              <label class="rf-label">Teléfono</label>
              <bw-phone-input [ngModel]="editPhone()" (ngModelChange)="editPhone.set($event)" />
            </div>
          </div>
        }
      </div>

      <!-- Actions -->
      <div class="rce-actions">
        <p-button
          label="Volver"
          icon="pi pi-chevron-left"
          variant="text"
          severity="secondary"
          size="small"
          (onClick)="cancelEditClient()"
        />
        <p-button
          label="Actualizar paciente"
          icon="pi pi-check"
          size="small"
          [loading]="savingClient()"
          [disabled]="!editFirstName() || !editLastName()"
          (onClick)="saveClient()"
        />
      </div>
    </div>
  }

  <!-- ── Profesional + Servicio ────────────────────────────────────────────────── -->
  <div class="rf-card rf-fields">
    <div class="rf-field">
      <label class="rf-label">Profesional</label>
      <div class="rf-field-row">
        <p-select
          [options]="providerOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="selectedProviderId()"
          (ngModelChange)="selectedProviderId.set($event)"
          placeholder="Seleccionar profesional"
          [appendTo]="'body'"
          class="rf-select"
        />
        <p-button
          icon="pi pi-building"
          variant="text"
          severity="secondary"
          [rounded]="true"
          size="small"
        />
      </div>
    </div>

    <div class="rf-field">
      <label class="rf-label">Servicios</label>
      <div class="rf-field-row">
        <p-select
          [options]="[
            { label: booking().service?.name ?? 'Sin servicio', value: booking().service_id },
          ]"
          [ngModel]="booking().service_id"
          [disabled]="true"
          [appendTo]="'body'"
          class="rf-select rf-select--locked"
        />
        <p-button
          [icon]="serviceDisabled() ? 'pi pi-lock' : 'pi pi-lock-open'"
          variant="text"
          [severity]="serviceDisabled() ? 'danger' : 'secondary'"
          [rounded]="true"
          size="small"
          [disabled]="true"
        />
      </div>
    </div>
  </div>

  <!-- ── Información adicional ─────────────────────────────────────────────────── -->
  <p-panel header="Información adicional" [toggleable]="true" [collapsed]="true" class="rf-panel">
    <div class="rf-field">
      <label class="rf-label">Notas para el paciente</label>
      <textarea
        pTextarea
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
        rows="3"
        placeholder="Agregar notas..."
        class="rf-notes"
        autoResize="true"
      ></textarea>
    </div>
  </p-panel>

  <!-- ── Acciones ──────────────────────────────────────────────────────────────── -->
  <div class="rf-actions">
    <p-button
      label="Guardar cambios"
      icon="pi pi-check"
      size="small"
      [loading]="saving()"
      (onClick)="save()"
    />
  </div>
</div>
