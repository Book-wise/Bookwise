<p-dialog
  [header]="isEdit() ? lang.t('booking_dlg.title.edit') : lang.t('booking_dlg.title.create')"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '500px' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onClose()"
>
  <div class="form-grid">
    <!-- Cliente -->
    <div class="field">
      <p-select
        [options]="clientOptions()"
        [(ngModel)]="formData.client_id"
        [placeholder]="lang.t('booking_dlg.placeholder.client')"
        [filter]="true"
        [filterPlaceholder]="lang.t('common.search')"
        class="w-full"
        (onChange)="onClientChange()"
      >
      </p-select>
      <small *ngIf="errors['client_id']" class="p-error">{{ errors['client_id'] }}</small>
    </div>

    <!-- Servicio -->
    <div class="field">
      <p-select
        [options]="serviceOptions()"
        [(ngModel)]="formData.service_id"
        [placeholder]="lang.t('booking_dlg.placeholder.service')"
        class="w-full"
        (onChange)="onServiceChange()"
      >
      </p-select>
      <small *ngIf="errors['service_id']" class="p-error">{{ errors['service_id'] }}</small>
    </div>

    <!-- Ubicación -->
    <div class="field">
      <p-select
        [options]="locationOptions()"
        [(ngModel)]="formData.location_id"
        [placeholder]="lang.t('booking_dlg.placeholder.location')"
        class="w-full"
        (onChange)="onLocationChange()"
      >
      </p-select>
      <small *ngIf="errors['location_id']" class="p-error">{{ errors['location_id'] }}</small>
    </div>

    <!-- Profesional (nullable) -->
    <div class="field">
      <p-select
        [options]="providerOptions()"
        [(ngModel)]="formData.provider_id"
        [placeholder]="lang.t('booking_dlg.placeholder.provider')"
        [showClear]="true"
        class="w-full"
        (onChange)="onProviderChange()"
      >
      </p-select>
    </div>

    <!-- Fecha y Hora -->
    <div class="field-row">
      <div class="field">
        <p-floatlabel>
          <p-datepicker
            [(ngModel)]="formData.start_time"
            dateFormat="dd/mm/yy"
            [showTime]="true"
            hourFormat="24"
            class="w-full"
            inputId="startTime"
          />
          <label for="startTime">{{ lang.t('booking_dlg.date_time') }}</label>
        </p-floatlabel>
      </div>

      <div class="field">
        <p-floatlabel>
          <input
            pInputNumber
            [(ngModel)]="formData.duration_minutes"
            [min]="15"
            [max]="240"
            class="w-full"
            inputId="duration"
          />
          <label for="duration">{{ lang.t('booking_dlg.duration') }}</label>
        </p-floatlabel>
      </div>
    </div>

    <!-- Estado -->
    <div class="field" *ngIf="isEdit()">
      <p-select
        [options]="statusOptions()"
        [(ngModel)]="formData.status_id"
        [placeholder]="lang.t('status.5')"
        class="w-full"
      >
      </p-select>
    </div>

    <!-- Precio -->
    <div class="field">
      <p-floatlabel>
        <p-inputnumber
          [(ngModel)]="formData.price"
          mode="currency"
          [currency]="currencyConfig.code"
          [locale]="currencyConfig.locale"
          class="w-full"
          inputId="price"
        />
        <label for="price">{{ lang.t('common.price') }}</label>
      </p-floatlabel>
    </div>

    <!-- Notas -->
    <div class="field">
      <textarea
        pTextarea
        [(ngModel)]="formData.notes"
        rows="3"
        [placeholder]="lang.t('booking_dlg.notes_placeholder')"
        class="w-full"
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <p-button
        *ngIf="isEdit() && canCancel()"
        [label]="lang.t('booking_dlg.btn.cancel_booking')"
        icon="pi pi-times"
        class="p-button-danger p-button-outlined"
        (onClick)="onCancel()"
      >
      </p-button>

      <div class="spacer"></div>

      <p-button [label]="lang.t('common.close')" class="p-button-text" (onClick)="onClose()"></p-button>

      <p-button
        [label]="isEdit() ? lang.t('booking_dlg.btn.update') : lang.t('booking_dlg.btn.create')"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="!isFormValid()"
        (onClick)="onSave()"
      >
      </p-button>
    </div>
  </ng-template>
</p-dialog>
