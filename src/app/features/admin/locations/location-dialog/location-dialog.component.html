<p-dialog
  [visible]="visible()"
  [modal]="true"
  [style]="{ width: '540px' }"
  [contentStyle]="{ 'overflow-y': 'auto', 'max-height': '70vh' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onClose()"
  [pt]="{ footer: { style: { paddingTop: '1.25rem' } } }"
>
  <ng-template pTemplate="header">
    <div class="location-dialog-header">
      <span class="location-dialog-title">{{ title() }}</span>
    </div>
  </ng-template>

  <div class="location-form" [formGroup]="form">
    <div class="field">
      <label>Nombre *</label>
      <input pInputText formControlName="name" [disabled]="isView()" placeholder="Sucursal Santiago Centro" class="w-full" />
    </div>

    <div class="field">
      <label>Dirección *</label>
      <input pInputText formControlName="address" [disabled]="isView()" placeholder="Av. Providencia 1234" class="w-full" />
    </div>

    <div class="field-row">
      <div class="field">
        <label>Ciudad *</label>
        <input pInputText formControlName="city" [disabled]="isView()" placeholder="Santiago" class="w-full" />
      </div>
      <div class="field">
        <label>Región *</label>
        <p-select
          formControlName="regionId"
          [options]="regionOptions()"
          (onChange)="onRegionChange()"
          [disabled]="isView()"
          placeholder="Seleccionar..."
          [appendTo]="'body'"
          class="w-full"
        />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Comuna</label>
        <p-select
          formControlName="comunaId"
          [options]="comunaOptions()"
          [disabled]="isView() || !form.controls.regionId.value"
          [placeholder]="form.controls.regionId.value ? 'Seleccionar...' : 'Primero seleccione región'"
          [appendTo]="'body'"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Código Postal</label>
        <input pInputText formControlName="codigoPostal" (input)="onCodigoPostalInput($event)" [disabled]="isView()" placeholder="7500000" class="w-full" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Apertura</label>
        <p-datepicker
          formControlName="openingTime"
          [disabled]="isView()"
          timeOnly="true"
          hourFormat="24"
          [appendTo]="'body'"
          class="w-full"
        />
      </div>
      <div class="field">
        <label>Cierre</label>
        <p-datepicker
          formControlName="closingTime"
          [disabled]="isView()"
          timeOnly="true"
          hourFormat="24"
          [appendTo]="'body'"
          class="w-full"
        />
      </div>
    </div>

    <div class="field">
      <label>Activa</label>
      <div class="toggle-row">
        <p-toggleswitch formControlName="active" [disabled]="isView()" />
        <span class="toggle-label" [class.active]="form.controls.active.value">{{ form.controls.active.value ? 'Sí, está activa' : 'No, está inactiva' }}</span>
      </div>
    </div>

    @if (isView() && location(); as loc) {
      <div class="metadata-row">
        <span class="metadata-label">Creada: {{ loc.created_at | date:'short' }}</span>
        <span class="metadata-label">Actualizada: {{ loc.updated_at | date:'short' }}</span>
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      @if (isView()) {
        <p-button label="Cerrar" severity="secondary" [outlined]="true" (onClick)="onClose()" />
        <p-button label="Editar" icon="pi pi-pencil" (onClick)="switchToEdit()" />
      } @else {
        <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="onClose()" />
        <p-button [label]="saveLabel()" icon="pi pi-check" [loading]="saving()" [disabled]="!isFormValid()" (onClick)="onSave()" />
      }
    </div>
  </ng-template>
</p-dialog>
