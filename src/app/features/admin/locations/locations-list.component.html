<p-card header="Locations">
  <p-table [value]="locations()" [tableStyle]="{'min-width': '50rem'}" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Ciudad</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-location>
      <tr>
        <td>{{ location.id }}</td>
        <td>{{ location.name }}</td>
        <td>{{ location.address }}</td>
        <td>{{ location.city }}</td>
        <td>
          <p-tag [value]="location.active ? 'Activo' : 'Inactivo'" 
                 [severity]="location.active ? 'success' : 'danger'"></p-tag>
        </td>
        <td>
          <p-button icon="pi pi-pencil" class="p-button-text" pTooltip="Editar"></p-button>
          <p-button icon="pi pi-eye" class="p-button-text" pTooltip="Ver"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center">No se encontraron locations</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
