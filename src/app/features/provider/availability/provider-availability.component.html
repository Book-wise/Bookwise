<div class="availability-container">
  <h2>Mi Disponibilidad</h2>
  <p class="subtitle">Configura tus horarios de atención por día de la semana</p>
  
  <p-card>
    <p-table [value]="availabilitySlots()" [tableStyle]="{'min-width': '50rem'}">
      <ng-template pTemplate="header">
        <tr>
          <th>Día</th>
          <th>Hora Inicio</th>
          <th>Hora Fin</th>
          <th>Activo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-slot let-editing="editing">
        <tr>
          <td>
            {{ getDayLabel(slot.day_of_week) }}
          </td>
          <td [pEditableColumn]="slot.start_time" pEditableColumnField="start_time">
            <p-cellEditor>
              <ng-template pTemplate="input">
                <input type="time" pInputText [(ngModel)]="slot.start_time" />
              </ng-template>
              <ng-template pTemplate="output">
                {{ slot.start_time }}
              </ng-template>
            </p-cellEditor>
          </td>
          <td [pEditableColumn]="slot.end_time" pEditableColumnField="end_time">
            <p-cellEditor>
              <ng-template pTemplate="input">
                <input type="time" pInputText [(ngModel)]="slot.end_time" />
              </ng-template>
              <ng-template pTemplate="output">
                {{ slot.end_time }}
              </ng-template>
            </p-cellEditor>
          </td>
          <td>
            <p-toggleswitch [(ngModel)]="slot.is_active"></p-toggleswitch>
          </td>
          <td>
            <p-button icon="pi pi-trash" styleClass="p-button-text p-button-danger" (onClick)="removeSlot(slot)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
    
    <div class="add-slot">
      <p-button label="Agregar Horario" icon="pi pi-plus" (onClick)="showAddDialog = true"></p-button>
    </div>
  </p-card>
  
  <p-card header="Vista Previa" styleClass="mt-3">
    <div class="preview-grid">
      <div *ngFor="let day of DAYS_OF_WEEK" class="preview-day">
        <div class="day-name">{{ day.label }}</div>
        <div class="day-slots" *ngIf="getSlotsForDay(day.value).length > 0; else noSlots">
          <div *ngFor="let slot of getSlotsForDay(day.value)" class="slot-preview" [class.inactive]="!slot.is_active">
            {{ slot.start_time }} - {{ slot.end_time }}
          </div>
        </div>
        <ng-template #noSlots>
          <div class="no-slots">Sin disponibilidad</div>
        </ng-template>
      </div>
    </div>
  </p-card>
  
  <div class="actions">
    <p-button label="Guardar Cambios" icon="pi pi-check" (onClick)="saveAvailability()" [loading]="saving()"></p-button>
  </div>
</div>

<!-- Dialog para agregar nuevo horario -->
<p-dialog header="Agregar Horario" [(visible)]="showAddDialog" [modal]="true" [style]="{width: '400px'}">
  <div class="add-dialog">
    <div class="field">
      <label>Día de la semana</label>
      <p-select [options]="DAYS_OF_WEEK" [(ngModel)]="newSlot.day_of_week" placeholder="Seleccionar día"></p-select>
    </div>
    <div class="field">
      <label>Hora inicio</label>
      <input type="time" pInputText [(ngModel)]="newSlot.start_time" />
    </div>
    <div class="field">
      <label>Hora fin</label>
      <input type="time" pInputText [(ngModel)]="newSlot.end_time" />
    </div>
    <div class="field">
      <p-toggleswitch [(ngModel)]="newSlot.is_active"></p-toggleswitch>
      <label>Activo</label>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" styleClass="p-button-text" (onClick)="showAddDialog = false"></p-button>
    <p-button label="Agregar" (onClick)="addSlot()"></p-button>
  </ng-template>
</p-dialog>
