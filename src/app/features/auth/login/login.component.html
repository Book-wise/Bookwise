<bw-auth-layout>
  <div class="form-header">
    <h2>{{ lang.t('auth.login.heading') }}</h2>
    <p>{{ lang.t('auth.login.subheading') }}</p>
  </div>

  <!--
    Proveedores de identidad: los endpoints de OAuth todavía no existen en el
    API (ver odd/tasks/email-automation.md → S8 y fase 1). Se muestran
    deshabilitados a propósito para no ofrecer un camino que hoy falla.

    Icono solo en una línea (S2 del pedido del usuario): con etiqueta de texto
    los tres ocupaban tres filas y comían el alto del formulario. La etiqueta
    accesible viaja en `aria-label` + `title`.
  -->
  <div class="providers">
    <button
      type="button"
      class="provider"
      disabled
      [attr.aria-label]="lang.t('auth.login.provider_google')"
      [attr.title]="lang.t('auth.login.provider_google')"
      aria-describedby="login-providers-pending">
      <span class="provider-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
      </span>
    </button>

    <button
      type="button"
      class="provider apple"
      disabled
      [attr.aria-label]="lang.t('auth.login.provider_apple')"
      [attr.title]="lang.t('auth.login.provider_apple')"
      aria-describedby="login-providers-pending">
      <span class="provider-icon" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.36 12.72c-.02-2.3 1.88-3.4 1.97-3.46-1.07-1.57-2.74-1.79-3.33-1.81-1.42-.14-2.77.83-3.49.83-.72 0-1.83-.81-3.01-.79-1.55.02-2.98.9-3.78 2.28-1.61 2.8-.41 6.94 1.16 9.21.77 1.11 1.68 2.35 2.88 2.31 1.16-.05 1.6-.75 3-.75s1.79.75 3.01.73c1.24-.02 2.03-1.13 2.79-2.25.88-1.29 1.24-2.54 1.26-2.6-.03-.01-2.42-.93-2.44-3.7zM14.1 5.98c.64-.77 1.07-1.85.95-2.92-.95.04-2.1.63-2.76 1.4-.61.7-1.12 1.79-.98 2.85 1.06.08 2.15-.54 2.79-1.33z"/>
        </svg>
      </span>
    </button>

    <button
      type="button"
      class="provider facebook"
      disabled
      [attr.aria-label]="lang.t('auth.login.provider_facebook')"
      [attr.title]="lang.t('auth.login.provider_facebook')"
      aria-describedby="login-providers-pending">
      <span class="provider-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.27h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/>
        </svg>
      </span>
    </button>
  </div>
  <p class="pending-note" id="login-providers-pending">
    {{ lang.t('auth.login.providers_pending') }}
  </p>

  <div class="divider"><span>{{ lang.t('auth.login.divider') }}</span></div>

  <form class="auth-form" (ngSubmit)="onLogin()" #loginForm="ngForm">
    <div class="field">
      <label for="email">Email</label>
      <input
        pInputText
        id="email"
        name="email"
        type="email"
        placeholder="tu@email.com"
        [(ngModel)]="credentials.email"
        required
        class="w-full" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <p-password
        inputId="password"
        name="password"
        placeholder="••••••••"
        [(ngModel)]="credentials.password"
        [feedback]="false"
        [toggleMask]="true"
        required />
    </div>

    @if (error()) {
      <p-message severity="error" class="w-full">{{ error() }}</p-message>
    }

    <p-button
      type="submit"
      label="Iniciar sesión"
      icon="pi pi-sign-in"
      class="w-full submit-btn"
      [loading]="loading()"
      [disabled]="!credentials.email || !credentials.password" />
  </form>

  <div class="forgot-password">
    <a routerLink="/forgot-password">{{ lang.t('auth.login.forgot') }}</a>
  </div>

  <!--
    Magic link: mismo caso que los proveedores, depende de S8 del documento de
    emails (POST /auth/magic-link). Deshabilitado hasta que exista el endpoint.
  -->
  <button type="button" class="magic-link" disabled aria-describedby="login-magic-pending">
    <i class="pi pi-envelope" aria-hidden="true"></i>
    <span>{{ lang.t('auth.login.magic_link_pending') }}</span>
  </button>
  <p class="pending-note center" id="login-magic-pending">
    {{ lang.t('auth.login.magic_link_note') }}
  </p>

  <div class="auth-footer">
    <span>¿No tienes cuenta?</span>
    <a routerLink="/register">Registrarse</a>
  </div>
</bw-auth-layout>
